version: '3'

tasks:
  dev:
    desc: "Build and run the application in Docker with the dummy database (data/dummy.db)"
    cmds:
      - mkdir -p data
      - DB_PATH=/app/data/dummy.db SEED_DUMMY_DATA=1 docker compose up --build

  run:
    desc: "Build and run the application in Docker with the production database (data/tracker.db)"
    cmds:
      - mkdir -p data
      - DB_PATH=/app/data/tracker.db SEED_DUMMY_DATA=0 docker compose up --build

  down:
    desc: "Stop the running Docker containers"
    cmds:
      - docker compose down

  clean:
    desc: "Stop containers and remove built images (preserves ./data)"
    cmds:
      - docker compose down --rmi local

  dev:reset:
    desc: "Reset the dummy database with fresh dummy data"
    cmds:
      - rm -f data/dummy.db data/dummy.db-wal data/dummy.db-shm
      - task: dev

  check:
    desc: "Run Go tests and linters"
    dir: backend
    cmds:
      - gofmt -l .
      - go vet ./...
      - go test ./...
      - staticcheck ./...

  fmt:
    desc: "Format Go code"
    dir: backend
    cmds:
      - gofmt -w .

